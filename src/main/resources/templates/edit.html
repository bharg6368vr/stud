<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Edit Student</title>

<style>

body{
font-family:Arial;
background:linear-gradient(120deg,#f6d365,#fda085);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.form-container{
background:white;
padding:30px;
width:420px;
border-radius:10px;
box-shadow:0px 4px 12px rgba(0,0,0,0.3);
}

h2{
text-align:center;
margin-bottom:20px;
color:#333;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

.updatebtn{
width:100%;
padding:12px;
background:#27ae60;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.updatebtn:hover{
background:#219150;
}

.backbtn{
margin-top:10px;
width:100%;
padding:10px;
background:#3498db;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.backbtn:hover{
background:#2c80b4;
}

</style>

</head>

<body>

<div class="form-container">

<h2>Edit Student</h2>

<form action="/update" method="post">

<input type="hidden" name="id" th:value="${student.id}">

<label>Name</label>
<input type="text" name="name" th:value="${student.name}" required>

<label>Attendance</label>
<input type="number" name="attendance" th:value="${student.attendance}" required>

<label>Average Marks</label>
<input type="number" name="averageMarks" th:value="${student.averageMarks}" required>

<button type="submit" class="updatebtn">Update Student</button>

</form>

<a href="/">
<button class="backbtn">Back</button>
</a>

</div>

</body>
</html>
