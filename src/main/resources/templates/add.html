<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Add Student</title>

<style>

body{
font-family: Arial;
background: linear-gradient(135deg,#6a6fd1,#8b65c7);
margin:0;
padding:0;
}

.container{
width:400px;
margin:auto;
margin-top:80px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

h2{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
background:#4CAF50;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#45a049;
}

.back{
display:block;
text-align:center;
margin-top:15px;
text-decoration:none;
color:#555;
}

</style>

</head>

<body>

<div class="container">

<h2>Add Student</h2>

<form th:action="@{/save}" th:object="${student}" method="post">

<input type="text" th:field="*{name}" placeholder="Student Name" required>

<input type="number" th:field="*{attendance}" placeholder="Attendance %" required>

<input type="number" th:field="*{averageMarks}" placeholder="Average Marks" required>

<button type="submit">Save Student</button>

</form>

<a href="/" class="back">⬅ Back to Dashboard</a>

</div>

</body>
</html>
