<!DOCTYPE html>
<html>
<head>

<title>Update Student</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#43cea2,#185a9d);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.box{
background:white;
padding:30px;
width:420px;
border-radius:10px;
box-shadow:0px 4px 15px rgba(0,0,0,0.3);
}

h2{
text-align:center;
color:#333;
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#e67e22;
color:white;
border:none;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#d35400;
}

</style>

</head>

<body>

<div class="box">

<h2>Update Student</h2>

<form action="/update" method="post">

<input type="hidden" name="id">

<input type="text" name="name" placeholder="Student Name">

<input type="number" name="attendance" placeholder="Attendance">

<input type="number" name="averageMarks" placeholder="Marks">

<button type="submit">Update</button>

</form>

</div>

</body>
</html>
