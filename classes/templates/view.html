<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>View Student</title>

<style>

body{
font-family: Arial;
background: linear-gradient(135deg,#667eea,#764ba2);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.card{
background:white;
padding:30px;
width:400px;
border-radius:10px;
box-shadow:0px 4px 15px rgba(0,0,0,0.3);
text-align:center;
}

h2{
color:#333;
margin-bottom:20px;
}

.detail{
font-size:18px;
margin:10px 0;
}

.backbtn{
margin-top:20px;
padding:10px 20px;
background:#3498db;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.backbtn:hover{
background:#2980b9;
}

</style>

</head>

<body>

<div class="card">

<h2>Student Details</h2>

<div class="detail">ID : <span th:text="${student.id}"></span></div>
<div class="detail">Name : <span th:text="${student.name}"></span></div>
<div class="detail">Attendance : <span th:text="${student.attendance}"></span></div>
<div class="detail">Marks : <span th:text="${student.averageMarks}"></span></div>
<div class="detail">Performance : <span th:text="${student.performance}"></span></div>

<a href="/">
<button class="backbtn">Back to Dashboard</button>
</a>

</div>

</body>
</html>
