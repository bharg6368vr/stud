<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Student Performance Dashboard</title>

<style>

body{
font-family: Arial;
background: linear-gradient(120deg,#2980b9,#6dd5fa);
margin:0;
padding:0;
}

.container{
width:90%;
margin:auto;
margin-top:40px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

h1{
text-align:center;
color:#2c3e50;
}

.addbtn{
background:#27ae60;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
margin-bottom:15px;
}

.addbtn:hover{
background:#219150;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th{
background:#34495e;
color:white;
padding:12px;
}

td{
padding:10px;
text-align:center;
border-bottom:1px solid #ddd;
}

tr:hover{
background:#f2f2f2;
}

.viewbtn{
background:#3498db;
color:white;
border:none;
padding:6px 12px;
border-radius:4px;
cursor:pointer;
}

.updatebtn{
background:#f39c12;
color:white;
border:none;
padding:6px 12px;
border-radius:4px;
cursor:pointer;
}

.deletebtn{
background:#e74c3c;
color:white;
border:none;
padding:6px 12px;
border-radius:4px;
cursor:pointer;
}

button:hover{
opacity:0.8;
}

</style>

</head>

<body>

<div class="container">

<h1>Student Performance Prediction System</h1>

<a href="/add">
<button class="addbtn">Add New Student</button>
</a>

<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Attendance</th>
<th>Marks</th>
<th>Performance</th>
<th>Actions</th>
</tr>

<tr th:each="student : ${students}">

<td th:text="${student.id}"></td>
<td th:text="${student.name}"></td>
<td th:text="${student.attendance}"></td>
<td th:text="${student.averageMarks}"></td>
<td th:text="${student.performance}"></td>

<td>

<a th:href="@{/view/{id}(id=${student.id})}">
<button class="viewbtn">View</button>
</a>

<a th:href="@{/edit/{id}(id=${student.id})}">
<button class="updatebtn">Update</button>
</a>

<a th:href="@{/delete/{id}(id=${student.id})}">
<button class="deletebtn">Delete</button>
</a>

</td>

</tr>


</table>

</div>

</body>
</html>
